name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file deliverable
        run: node build.mjs
      - name: Golden tests against the frozen legacy build
        run: node --test test/
      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheets-generator
          path: Sheets Generator.html
